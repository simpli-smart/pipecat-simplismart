[project]
name = "pipecat-simplismart"
version = "0.1.0"
description = "Simplismart STT, TTS, and LLM services for the Pipecat voice framework"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
authors = [{ name = "Simplismart" }]
keywords = ["pipecat", "simplismart", "stt", "tts", "llm", "voice"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aiohttp>=3.14.3",
  "loguru>=0.7.0",
  "pipecat-ai>=0.0.86",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
example = [
  "pipecat-ai[runner,webrtc,silero]>=0.0.86",
]

[project.urls]
Homepage = "https://github.com/simplismart/pipecat-simplismart"
Source = "https://github.com/simplismart/pipecat-simplismart"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_simplismart"]

[tool.hatch.build.targets.wheel.sources]
"src/pipecat_simplismart" = "pipecat_simplismart"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.uv]
dev-dependencies = []
